<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الطلب - أنعام السعودية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* نفس التنسيقات الأساسية من الصفحة السابقة */
        :root {
            --primary: #8B4513;
            --secondary: #A0522D;
            --accent: #D2691E;
            --light: #FDF6E3;
            --dark: #5D4037;
            --success: #27AE60;
            --danger: #E74C3C;
            --warning: #F39C12;
            --info: #3498DB;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --gradient: linear-gradient(135deg, var(--primary), var(--accent));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
        }

        body {
            background: #f8f9fa;
            color: #2C3E50;
            line-height: 1.6;
            padding-bottom: 70px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* تنسيقات الصفحة */
        .confirmation-container {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            margin: 40px auto;
        }

        .confirmation-header {
            background: var(--success);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .confirmation-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .confirmation-title {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .order-number {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            display: inline-block;
        }

        .confirmation-body {
            padding: 40px 30px;
        }

        .order-timeline {
            margin: 30px 0;
        }

        .timeline-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .timeline-item:last-child {
            border-bottom: none;
        }

        .timeline-icon {
            width: 50px;
            height: 50px;
            background: var(--light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .timeline-content {
            flex: 1;
        }

        .timeline-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--dark);
        }

        .timeline-desc {
            color: #7F8C8D;
            font-size: 14px;
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            .confirmation-container {
                margin: 20px 15px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="confirmation-container">
            <div class="confirmation-header">
                <div class="confirmation-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h1 class="confirmation-title">تم تأكيد طلبك بنجاح!</h1>
                <div class="order-number">رقم الطلب: #ORD-2024-00123</div>
            </div>
            
            <div class="confirmation-body">
                <h3 style="color: var(--primary); margin-bottom: 20px;">معلومات الطلب</h3>
                
                <div class="order-timeline">
                    <div class="timeline-item">
                        <div class="timeline-icon">
                            <i class="fas fa-shopping-cart"></i>
                        </div>
                        <div class="timeline-content">
                            <div class="timeline-title">تم تأكيد الطلب</div>
                            <div class="timeline-desc">تم تأكيد طلبك وسيتم تجهيزه للشحن</div>
                        </div>
                    </div>
                    
                    <div class="timeline-item">
                        <div class="timeline-icon">
                            <i class="fas fa-box"></i>
                        </div>
                        <div class="timeline-content">
                            <div class="timeline-title">قيد التجهيز</div>
                            <div class="timeline-desc">سيتم تجهيز الطلب خلال 24 ساعة</div>
                        </div>
                    </div>
                    
                    <div class="timeline-item">
                        <div class="timeline-icon">
                            <i class="fas fa-shipping-fast"></i>
                        </div>
                        <div class="timeline-content">
                            <div class="timeline-title">التسليم</div>
                            <div class="timeline-desc">سيتم التسليم خلال 2-3 أيام عمل</div>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <a href="profile.html#orders" class="btn btn-outline">
                        <i class="fas fa-list"></i> عرض طلباتي
                    </a>
                    <a href="index.html" class="btn btn-primary">
                        <i class="fas fa-home"></i> العودة للرئيسية
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
