<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحادثة - أنعام السعودية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* نفس التنسيقات الأساسية */
        :root {
            --primary: #8B4513;
            --secondary: #A0522D;
            --accent: #D2691E;
            --light: #FDF6E3;
            --dark: #5D4037;
            --success: #27AE60;
            --danger: #E74C3C;
            --warning: #F39C12;
            --info: #3498DB;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --gradient: linear-gradient(135deg, var(--primary), var(--accent));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
        }

        body {
            background: #f8f9fa;
            color: #2C3E50;
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            box-shadow: var(--shadow-lg);
        }

        .chat-header {
            background: var(--gradient);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: 700;
            font-size: 1.2rem;
        }

        .user-status {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            max-width: 70%;
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
        }

        .message.sent {
            background: var(--primary);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }

        .message.received {
            background: white;
            color: #2C3E50;
            border: 1px solid #e1e5e9;
            border-bottom-left-radius: 5px;
        }

        .message-time {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 5px;
            text-align: left;
        }

        .message.sent .message-time {
            text-align: right;
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e1e5e9;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .message-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 25px;
            font-size: 14px;
            resize: none;
            height: 50px;
            max-height: 120px;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            background: var(--secondary);
            transform: scale(1.05);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e1e5e9;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            background: var(--light);
            border: 1px solid var(--primary);
            border-radius: 8px;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: var(--primary);
            color: white;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="user-avatar">أ</div>
            <div class="user-info">
                <div class="user-name">أحمد محمد</div>
                <div class="user-status">مشتري - متصل الآن</div>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message received">
                <div>مرحباً، أنا الفائز بالمزاد وأرغب في تأكيد الشراء</div>
                <div class="message-time">10:30 ص</div>
            </div>
            
            <div class="message sent">
                <div>أهلاً وسهلاً، مبروك الفوز! هل تحتاج أي معلومات إضافية؟</div>
                <div class="message-time">10:32 ص</div>
            </div>
            
            <div class="message received">
                <div>نعم، أريد معرفة مواعيد الاستلام المتاحة</div>
                <div class="message-time">10:33 ص</div>
            </div>
        </div>

        <div class="action-buttons">
            <div class="action-btn" onclick="sendTemplate('أرغب في تأكيد موعد الاستلام')">
                تأكيد الموعد
            </div>
            <div class="action-btn" onclick="sendTemplate('ما هي خيارات الدفع المتاحة؟')">
                استفسار الدفع
            </div>
            <div class="action-btn" onclick="sendTemplate('هل يمكنني إضافة منتجات أخرى؟')">
                إضافة منتجات
            </div>
        </div>
        
        <div class="chat-input">
            <textarea class="message-input" placeholder="اكتب رسالتك هنا..." id="messageInput"></textarea>
            <button class="send-btn" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message) {
                const chatMessages = document.getElementById('chatMessages');
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message sent';
                messageDiv.innerHTML = `
                    <div>${message}</div>
                    <div class="message-time">${new Date().toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'})}</div>
                `;
                
                chatMessages.appendChild(messageDiv);
                input.value = '';
                
                // محاكاة رد البائع
                setTimeout(() => {
                    const replyDiv = document.createElement('div');
                    replyDiv.className = 'message received';
                    replyDiv.innerHTML = `
                        <div>شكراً لاستفسارك، سنقوم بالرد عليك قريباً</div>
                        <div class="message-time">${new Date().toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'})}</div>
                    `;
                    chatMessages.appendChild(replyDiv);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }, 2000);
                
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function sendTemplate(message) {
            const input = document.getElementById('messageInput');
            input.value = message;
            sendMessage();
        }

        // إرسال الرسالة بالضغط على Enter
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
